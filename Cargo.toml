[package]
name = "omnicli"
version = "0.0.0-git"
authors = ["Raphaël Beamonte <raphael.beamonte@gmail.com>"]
description = "Omnipotent dev tool"
documentation = "https://omnicli.dev"
edition = "2021"
homepage = "https://omnicli.dev"
license = "LGPL-2.1"
readme = "README.md"
repository = "https://github.com/xaf/omni"
exclude = [
    ".github/*",
    "website/*",
]

[[bin]]
name = "omni"
path = "src/main.rs"

[features]
default = ["self-update-check"]
self-update = []
self-update-check = ["self-update"]

[build-dependencies]
time = { version = "0.3.55", features = ["serde-well-known"] }

[dev-dependencies]
mockito = "1.7.2"
temp-env = "0.3.6"

[dependencies]
blake3 = "1.8.7"
feuilletage = { version = "0.1.1", features = ["yaml", "json", "std"] }
cfg-if = "1.0.4"
clap = { version = "4.6.6", features = ["string"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
duct = "1.1.1"
flate2 = "1.1.9"
fs4 = "1.1.0"
futures = "0.3.34"
gethostname = "1.1.0"
git-url-parse = "0.6.0"
git2 = { version = "0.21.0", features = ["vendored-libgit2"] }
glob = "0.3.4"
globset = "0.4.20"
humantime = "2.4.0"
imara-diff = "0.2.0"
indexmap = "2.14.0"
indicatif = "0.18.6"
itertools = "0.15.0"
lazy_static = "1.5.0"
libz-sys = { version = "1.1.29", features = ["static"] }  # So we can force static linking
machine-uid = "0.6.0"
md-5 = "0.11.0"
nix = { version = "0.31.3", features = ["fs", "process", "signal"] }
node-semver = "2.2.0"
normalize-path = "0.2.1"
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
once_cell = "1.21.4"
openssl = { version = "0.10.81", features = ["vendored"] }  # So it can be bundled with the binary
path-clean = "1.0.1"
pathdiff = "0.2.3"
percent-encoding = "2.3.2"
petname = "3.2.0"
rand = "0.10.2"
r2d2 = "0.8.10"
r2d2_sqlite = { version = "0.35.0", features = ["bundled"] }
regex = "1.13.1"
requestty = "0.6.3"
reqwest = { version = "0.13.4", features = ["blocking"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
self-replace = "1.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
toml = "1.1.4"
sha1 = "0.11.0"
sha2 = "0.11.0"
shell-escape = "0.1.5"
shell-words = "1.1.1"
strsim = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
tera = "2.2.0"
term_cursor = "0.2.1"
term_size = "0.3.2"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros", "serde-well-known"] }
tokio = { version = "1.53.1", features = ["full"] }
url = "2.5.8"
uuid = { version = "1.25.0", features = ["v4", "fast-rng"] }
walkdir = "2.5.0"
which = "8.0.5"
whoami = "2.1.3"
liblzma = "0.4.8"
zip-extract = "0.4.1"

[package.metadata.cargo-machete]
ignored = ["libz-sys", "openssl"]

[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-x86_64-darwin.tar.gz"
checksum-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-x86_64-darwin.sha256"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-arm64-darwin.tar.gz"
checksum-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-arm64-darwin.sha256"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-x86_64-linux.tar.gz"
checksum-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-x86_64-linux.sha256"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-arm64-linux.tar.gz"
checksum-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-arm64-linux.sha256"
